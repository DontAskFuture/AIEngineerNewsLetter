# Docker's default json-file driver never rotates, so an unbounded worker log
# will eventually fill the host volume and take Postgres down with it.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-intel-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_intel}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_intel"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Without this, Postgres does not return after a host reboot while web and
    # worker do, leaving them to crash-loop against a missing database.
    mem_limit: 1g
    restart: unless-stopped
    logging: *logging

  migrate:
    build:
      context: .
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ai_intel}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RAW_STORAGE_DIR: /app/var/raw
      FETCH_INTERVAL_MINUTES: ${FETCH_INTERVAL_MINUTES:-60}
    restart: "no"
    logging: *logging

  web:
    build:
      context: .
      target: web
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ai_intel}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FETCH_INTERVAL_MINUTES: ${FETCH_INTERVAL_MINUTES:-60}
      CRAWLED_DOCUMENT_TTL_DAYS: ${CRAWLED_DOCUMENT_TTL_DAYS:-30}
      CRAWLED_DOCUMENT_CLEANUP_INTERVAL_MINUTES: ${CRAWLED_DOCUMENT_CLEANUP_INTERVAL_MINUTES:-1440}
      CRAWLED_DOCUMENT_CLEANUP_BATCH_SIZE: ${CRAWLED_DOCUMENT_CLEANUP_BATCH_SIZE:-500}
      SCORING_MAX_DOCUMENTS_PER_RUN: ${SCORING_MAX_DOCUMENTS_PER_RUN:-20}
      SCORING_LOOKBACK_DAYS: ${SCORING_LOOKBACK_DAYS:-30}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-~deepseek/deepseek-flash-latest}
      FEED_SHOW_WHY_RELEVANT: ${FEED_SHOW_WHY_RELEVANT:-false}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Los_Angeles}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-lianglingfan@gmail.com}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-lianglingfan@gmail.com}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-30}
      BRAND_AUTHOR_NAME: ${BRAND_AUTHOR_NAME:-Michael}
      BRAND_AUTHOR_BIO: ${BRAND_AUTHOR_BIO:-}
      BRAND_X_URL: ${BRAND_X_URL:-}
      BRAND_LINKEDIN_URL: ${BRAND_LINKEDIN_URL:-}
      BRAND_GITHUB_URL: ${BRAND_GITHUB_URL:-}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 1g
    restart: unless-stopped
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    depends_on:
      web:
        condition: service_started
    command: tunnel --no-autoupdate --protocol http2 --metrics 127.0.0.1:2000 run --token-file /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 256m
    restart: always
    logging: *logging
    profiles:
      - tunnel

  worker:
    build:
      context: .
      target: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ai_intel}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RAW_STORAGE_DIR: /app/var/raw
      FETCH_INTERVAL_MINUTES: ${FETCH_INTERVAL_MINUTES:-60}
      FETCH_WORKER_CONCURRENCY: ${FETCH_WORKER_CONCURRENCY:-5}
      CRAWLED_DOCUMENT_TTL_DAYS: ${CRAWLED_DOCUMENT_TTL_DAYS:-30}
      CRAWLED_DOCUMENT_CLEANUP_INTERVAL_MINUTES: ${CRAWLED_DOCUMENT_CLEANUP_INTERVAL_MINUTES:-1440}
      CRAWLED_DOCUMENT_CLEANUP_BATCH_SIZE: ${CRAWLED_DOCUMENT_CLEANUP_BATCH_SIZE:-500}
      SCORING_MAX_DOCUMENTS_PER_RUN: ${SCORING_MAX_DOCUMENTS_PER_RUN:-20}
      SCORING_LOOKBACK_DAYS: ${SCORING_LOOKBACK_DAYS:-30}
      NEWSLETTER_CHECK_INTERVAL_MINUTES: ${NEWSLETTER_CHECK_INTERVAL_MINUTES:-30}
      NEWSLETTER_SEND_HOUR: ${NEWSLETTER_SEND_HOUR:-8}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-~deepseek/deepseek-flash-latest}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Los_Angeles}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Michael's AI Brief}
      BRAND_AUTHOR_NAME: ${BRAND_AUTHOR_NAME:-Michael}
      BRAND_AUTHOR_BIO: ${BRAND_AUTHOR_BIO:-}
      BRAND_X_URL: ${BRAND_X_URL:-}
      BRAND_LINKEDIN_URL: ${BRAND_LINKEDIN_URL:-}
      BRAND_GITHUB_URL: ${BRAND_GITHUB_URL:-}
      NODE_ENV: production
    volumes:
      - raw_data:/app/var/raw
    mem_limit: 2g
    restart: unless-stopped
    logging: *logging

volumes:
  postgres_data:
  raw_data:

secrets:
  cloudflare_tunnel_token:
    file: ./.secrets/cloudflare_tunnel_token
