services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-intel-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_intel}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_intel"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ai_intel}
      LOG_LEVEL: info
      RAW_STORAGE_DIR: /app/var/raw
      FETCH_INTERVAL_MINUTES: 60
    restart: "no"

  web:
    build:
      context: .
      target: web
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ai_intel}
      LOG_LEVEL: info
      RAW_STORAGE_DIR: /app/var/raw
      FETCH_INTERVAL_MINUTES: 60
      CRAWLED_DOCUMENT_TTL_DAYS: ${CRAWLED_DOCUMENT_TTL_DAYS:-365}
      CRAWLED_DOCUMENT_CLEANUP_INTERVAL_MINUTES: ${CRAWLED_DOCUMENT_CLEANUP_INTERVAL_MINUTES:-1440}
      CRAWLED_DOCUMENT_CLEANUP_BATCH_SIZE: ${CRAWLED_DOCUMENT_CLEANUP_BATCH_SIZE:-500}
      SCORING_MAX_DOCUMENTS_PER_RUN: ${SCORING_MAX_DOCUMENTS_PER_RUN:-20}
      SCORING_LOOKBACK_DAYS: ${SCORING_LOOKBACK_DAYS:-30}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4-flash}
      FEED_SHOW_WHY_RELEVANT: ${FEED_SHOW_WHY_RELEVANT:-false}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Los_Angeles}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-lianglingfan@gmail.com}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-lianglingfan@gmail.com}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-30}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    depends_on:
      web:
        condition: service_started
    command: tunnel --no-autoupdate run --token-file /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    restart: unless-stopped
    profiles:
      - tunnel

  worker:
    build:
      context: .
      target: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ai_intel}
      LOG_LEVEL: info
      RAW_STORAGE_DIR: /app/var/raw
      FETCH_INTERVAL_MINUTES: 60
      FETCH_WORKER_CONCURRENCY: 5
      CRAWLED_DOCUMENT_TTL_DAYS: ${CRAWLED_DOCUMENT_TTL_DAYS:-365}
      CRAWLED_DOCUMENT_CLEANUP_INTERVAL_MINUTES: ${CRAWLED_DOCUMENT_CLEANUP_INTERVAL_MINUTES:-1440}
      CRAWLED_DOCUMENT_CLEANUP_BATCH_SIZE: ${CRAWLED_DOCUMENT_CLEANUP_BATCH_SIZE:-500}
      SCORING_MAX_DOCUMENTS_PER_RUN: ${SCORING_MAX_DOCUMENTS_PER_RUN:-20}
      SCORING_LOOKBACK_DAYS: ${SCORING_LOOKBACK_DAYS:-30}
      NEWSLETTER_CHECK_INTERVAL_MINUTES: ${NEWSLETTER_CHECK_INTERVAL_MINUTES:-30}
      NEWSLETTER_SEND_HOUR: ${NEWSLETTER_SEND_HOUR:-8}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4-flash}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Los_Angeles}
      SENDPULSE_CLIENT_ID: ${SENDPULSE_CLIENT_ID:-}
      SENDPULSE_CLIENT_SECRET: ${SENDPULSE_CLIENT_SECRET:-}
      SENDPULSE_FROM_EMAIL: ${SENDPULSE_FROM_EMAIL:-}
      SENDPULSE_FROM_NAME: ${SENDPULSE_FROM_NAME:-AI Builder Intelligence}
      NODE_ENV: production
    volumes:
      - raw_data:/app/var/raw
    restart: unless-stopped

volumes:
  postgres_data:
  raw_data:

secrets:
  cloudflare_tunnel_token:
    file: ./.secrets/cloudflare_tunnel_token
