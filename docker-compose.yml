services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-intel-postgres
    environment:
      POSTGRES_DB: ai_intel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_intel"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_intel
      LOG_LEVEL: info
      RAW_STORAGE_DIR: /app/var/raw
      FETCH_INTERVAL_MINUTES: 15
    restart: "no"

  web:
    build:
      context: .
      target: web
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_intel
      LOG_LEVEL: info
      RAW_STORAGE_DIR: /app/var/raw
      FETCH_INTERVAL_MINUTES: 15
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Los_Angeles}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-lianglingfan@gmail.com}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-30}
      NODE_ENV: production
    ports:
      - "3000:3000"
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_intel
      LOG_LEVEL: info
      RAW_STORAGE_DIR: /app/var/raw
      FETCH_INTERVAL_MINUTES: 15
      NODE_ENV: production
    volumes:
      - raw_data:/app/var/raw
    restart: unless-stopped

volumes:
  postgres_data:
  raw_data:
